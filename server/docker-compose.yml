services:
  watchdog-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - '4040:4040'
    environment:
      PORT: '4040'
      WATCHDOG_DB_PATH: /app/data/watchdog.sqlite
      WATCHDOG_CONFIG_PATH: /app/data/config.json
      WATCHDOG_SETUP_MODE: auto
      WATCHDOG_DEFAULT_PROJECT_TOKEN: dev-project-token
    volumes:
      - watchdog-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  watchdog-data:
